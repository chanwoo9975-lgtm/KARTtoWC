      <div class="row" style="justify-content:center">${helmet(S.p.helmet,S.p.num,150)}</div>${helmetEditor(S.p.helmet)}<button class="btn" type="button" id="closeSheet">완료</button></section></div>`;
  if(sheet==='focus'){const p=S.p,can=S.phase==='ready';
    return`<div class="sheet" id="sheetBg"><section class="card"><h3 class="h2">집중 육성</h3><p class="muted" style="margin:0">${can?`최대 ${B.driver.max_focus_stats}개. 시즌 전에만 바꿀 수 있어요.`:'시즌 준비 단계에서 바꿀 수 있어요.'}</p>
      <div class="list">${STATS.map(k=>`<button class="item" type="button" data-focus2="${k}" aria-pressed="${p.focus.includes(k)}" ${can?'':'disabled'}><span class="body"><b>${LBL[k]}</b></span><span class="num" style="font-size:20px;color:var(--muted)">${p.stats[k]}</span><span class="tick"></span></button>`).join('')}</div>
      <button class="btn" type="button" id="closeSheet">완료</button></section></div>`}
  return menuSheet();
}
function menuSheet(){
  return`<div class="sheet" id="sheetBg"><section class="card"><h3 class="h3">설정</h3>
    ${DL?`<button class="btn ghost" type="button" id="exportBtn">저장 파일 내보내기</button>`:''}
    <button class="btn ghost" type="button" id="importBtn">저장 파일 불러오기</button>
    ${sheet==='confirm'?`<p style="margin:0">지금 커리어를 지우고 새로 시작할까요?</p><div class="grid2" style="grid-template-columns:1fr 1fr"><button class="btn ghost" type="button" id="cancelNew">취소</button><button class="btn" type="button" id="confirmNew" style="background:var(--bad)">새로 시작</button></div>`:
    sheet==='retire'?`<p style="margin:0">지금 은퇴하고 커리어 카드를 받을까요? 되돌릴 수 없어요.</p><div class="grid2" style="grid-template-columns:1fr 1fr"><button class="btn ghost" type="button" id="cancelNew">취소</button><button class="btn" type="button" id="confirmRetire">은퇴하기</button></div>`:
    `${S.phase!=='progress'?'<button class="btn ghost" type="button" id="askRetire">은퇴하기</button>':''}<button class="btn ghost" type="button" id="askNew" style="color:var(--bad)">새 커리어 시작</button>`}
    <button class="btn ghost" type="button" id="toTitle">타이틀 화면으로</button>
    <p class="muted" style="margin:0;font-size:12px">비공식 팬 게임이에요. 수익을 내지 않으며 F1·FIA·각 팀과 관련이 없어요. 팀명·로고·선수명 등 상표는 각 소유자의 것이에요.</p>
    <button class="btn" type="button" id="closeSheet">닫기</button></section></div>`;
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
async function saveFile(filename,data){
  if(!DL)return;try{await DL.save({filename,data});toast('저장했어요')}catch(e){if(e&&e.code!=='declined')toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.')}
}
root.addEventListener('input',e=>{
  if(!ob||S)return;
  if(e.target.id==='obName'){ob.name=e.target.value;const b=document.getElementById('obNext1');if(b)b.disabled=!ob.name.trim()}
  if(e.target.id==='obNum'){ob.num=clamp(parseInt(e.target.value)||2,2,99)}
});
root.addEventListener('change',e=>{if(e.target.id==='obNat')ob.nat=e.target.value;if(e.target.id==='obNum'){ob.num=clamp(parseInt(e.target.value)||2,2,99);render()}});
root.addEventListener('click',e=>{
  const t=e.target.closest('button,#sheetBg');if(!t)return;
  if(t.id==='sheetBg'&&e.target===t){sheet=null;render();return}
  const id=t.id,d=t.dataset;
  // onboarding
  if(id==='obRandom'){ob.name=genName();ob.num=ri(2,99);ob.nat=pick(Object.keys(K.nationalities));ob.helmet=randomHelmet();render();return}
  if(d.hb||d.hs||d.hp||d.hv){const tgt=S&&!S.p.retired?S.p:ob;if(!tgt)return;const h=normHelmet(tgt.helmet);
    if(d.hb)h.base=d.hb;if(d.hs)h.sec=d.hs;if(d.hp)h.pat=d.hp;if(d.hv)h.vis=d.hv;tgt.helmet=h;if(S)save();render();return}
  if(id==='hRandom'&&S){S.p.helmet=randomHelmet();save();render();return}
  if(id==='obNext1'){ob.step=2;render();return}
  if(id==='obBack'){ob.step--;render();return}
  if(d.style){ob.style=d.style;render();return}
  if(id==='obNext2'){ob.step=3;render();return}
  if(d.focus){const k=d.focus;if(ob.focus.includes(k))ob.focus=ob.focus.filter(x=>x!==k);else if(ob.focus.length<B.driver.max_focus_stats)ob.focus.push(k);render();return}
  if(id==='obDone'){newGame({name:ob.name.trim(),num:ob.num,nat:ob.nat,helmet:ob.helmet,style:ob.style,stats:ob.cands[ob.style],focus:ob.focus});ob=null;tab='home';render();window.scrollTo(0,0);return}
  // game
  if(id==='playBtn'){if(!S.train){sheet='train';render();return}startSeason();render();window.scrollTo(0,0);return}
  if(d.train&&S.phase==='ready'){const prev=S.train;S.train=d.train;const tr=TRAIN.find(x=>x.id===d.train);let msg=tr.name+(prev?'으로 바꿨어요':' 계획을 세웠어요')+' · 바꾸기 전까지 계속 유지돼요';save();sheet=null;render();toast(msg);return}
  if(d.gacha&&S.phase==='progress'&&S.season.gacha&&!S.season.gacha.done){
    const box=document.getElementById('pInc');const go=d.gacha==='go';
    if(go)box.querySelector('.card').innerHTML='<div class="eyebrow">결과를 기다리는 중</div><h3 class="h2">두근두근…</h3>';
    setTimeout(()=>{const res=resolveGacha(go);
      box.innerHTML=`<div class="sheet"><section class="card"><div class="eyebrow">휴식기 결과</div><h3 class="h2" style="color:${res.ok===true?'var(--gold)':res.ok===false?'#FF6B78':'var(--fg)'}">${res.ok===true?'성공!':res.ok===false?'실패…':'휴식'}</h3><p style="margin:0">${esc(res.t)}</p><button class="btn" type="button" id="gachaOk">시즌 이어가기</button></section></div>`;
      feed.unshift({t:`휴식기 · ${res.t}`,c:res.ok===true?'gold':res.ok===false?'bad':'blue'});paintFeed()},go?900:0);return}
  if(id==='gachaOk'){document.getElementById('pInc').innerHTML='';progTimer=setTimeout(stepProgress,400);return}
  if(d.inc!=null&&S.phase==='progress'){const inc=S.season.incidents.find(x=>x.r===progI&&!x.done);if(!inc)return;const res=applyIncident(inc,+d.inc);document.getElementById('pInc').innerHTML='';feed.unshift({t:`${roundName(inc.r)} · ${res.t}`,c:res.c});paintFeed();toast(res.t);progTimer=setTimeout(stepProgress,600);return}
  if(d.ntab){newsTab=d.ntab;newsMore=false;render();return}
  if(d.nmore){newsMore=!newsMore;render();return}
  if(d.tbrief){sheet={type:'tbrief',id:d.tbrief};render();return}
  if(d.brief!=null){sheet={type:'brief',i:+d.brief};render();return}
  if(d.pickoffer!=null){sel=+d.pickoffer;sheet=null;render();return}
  if(d.go){tab=d.go;sheet=null;render();window.scrollTo(0,0);return}
  if(d.sheet){sheet=d.sheet;render();return}
  if(d.choose){const[i,j]=d.choose.split(':').map(Number),e=evDef(S.events[i].id),c=e.choices[j];const msg=applyEff(c.eff);S.events.splice(i,1);save();sheet=null;render();toast(msg||'선택했어요');return}
  if(id==='acceptCh'){const m=runChallenge();sheet={type:'msg',title:'도전 결과',text:m};render();return}
  if(id==='declineCh'){S.challenge=null;save();sheet=null;render();return}
  if(d.focus2&&S.phase==='ready'){const k=d.focus2,p=S.p;if(p.focus.includes(k))p.focus=p.focus.filter(x=>x!==k);else if(p.focus.length<B.driver.max_focus_stats)p.focus.push(k);save();render();return}
  if(id==='askRetire'){sheet='retire';render();return}
  if(id==='confirmRetire'){sheet=null;retireNow();render();window.scrollTo(0,0);return}
  if(id==='skipProg'){finishProgress();return}
  if(id==='okBtn'){S.phase='offers';save();tab='season';render();window.scrollTo(0,0);return}
  if(d.offer!=null){sel=+d.offer;render();return}
  if(id==='chooseBtn'&&sel!=null){applyOffer(S.offers[sel]);sel=null;render();window.scrollTo(0,0);return}
  if(id==='menuBtn'){sheet='menu';render();return}
  if(id==='tCont'){lightsGo(enterGame);return}
  if(id==='tNew'){if(S&&!S.p.retired){titleAsk=true;render();return}lightsGo(()=>{S=null;try{localStorage.removeItem(KEY)}catch(_){}ob=null;enterGame()});return}
  if(id==='tYes'){lightsGo(()=>{S=null;try{localStorage.removeItem(KEY)}catch(_){}ob=null;enterGame()});return}
  if(id==='tNo'){titleAsk=false;render();return}
  if(id==='tHof'){hofOpen=true;render();return}
  if(id==='hofClose'){hofOpen=false;render();return}
  if(id==='toTitle'){sheet=null;title=true;render();window.scrollTo(0,0);return}
  if(id==='closeSheet'){sheet=null;render();return}
  if(id==='askNew'){sheet='confirm';render();return}
  if(id==='cancelNew'){sheet='menu';render();return}
  if(id==='confirmNew'){S=null;sheet=null;try{localStorage.removeItem(KEY)}catch(_){}ob=null;render();return}
  if(id==='exportBtn'){saveFile(`kart-to-wc-${S.p.name}-${S.year}.json`,JSON.stringify(S));return}
  if(id==='importBtn'){document.getElementById('importFile').click();return}
  if(id==='saveImg'){const c=drawCard();c.toBlob(b=>b&&saveFile(`career-${S.p.name}.png`,b),'image/png');return}
  if(id==='newCareer'){S=null;try{localStorage.removeItem(KEY)}catch(_){}ob=null;render();window.scrollTo(0,0);return}
});
tabsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;render();window.scrollTo(0,0)});
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s||!s.p||!s.teams)throw 0;S=s;sheet=null;save();render();toast('커리어를 불러왔어요')}catch(_){toast('저장 파일을 읽지 못했어요. 이 게임에서 내보낸 파일인지 확인해 주세요.')}};
  rd.readAsText(f);e.target.value='';
});

S=load();if(S){const p=S.p;p.fans??=10;p.morale??=60;p.repBonus??=0;if(p.val==null){p.val=0;p.valPeak=0}p.challenges??=[];p.monaco??=false;S.events??=[];S.challenge??=null;S.news??=null;S.train??=null;S.react??=null;S.vacancies??=[];if(S.phase==='progress'&&!S.season)S.phase='result';if(S.news&&!S.news.heads)S.news=null;S.notice??=null;p.contract??=null;p.helmet=normHelmet(p.helmet)}render();
(async()=>{try{if(window.claude&&window.claude.use){DL=await window.claude.use('downloads');if(DL)render()}}catch(_){}})();
document.fonts&&document.fonts.ready.then(()=>{if(S&&S.p.retired)render()});
</script>
