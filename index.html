<title>카트부터 월챔까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, cards stacked, bottom tab bar — paddock timing-screen numerals on a Toss-style dark app */
:root{
  --bg:#0E0F12; --surface:#1B1D22; --surface-2:#25282F; --line:#30333B;
  --fg:#F2F3F6; --muted:#8D929D; --dim:#5E636E;
  --accent:#3182F6; --accent-soft:#1B2E4D; --good:#34C77B; --bad:#F04452; --gold:#F2C14E;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Barlow Condensed","IBM Plex Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.02em}
.iconbtn{background:var(--surface-2);border:0;border-radius:12px;padding:8px 14px;color:var(--muted);font-size:14px}
.card{background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{color:var(--muted);font-size:14px}
.h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.3}
.h3{font-size:18px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.btn{background:var(--accent);color:#fff;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;width:100%}
.btn:disabled{background:var(--accent-soft);color:#6A84AD;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row > *{min-width:0}
.kv{display:flex;flex-direction:column;gap:12px}
.kv .row > span:first-child{color:var(--muted)}
.kv .row > span:last-child{font-weight:500;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border-radius:10px;padding:5px 10px;font-size:13px;color:var(--fg)}
.chip.blue{background:var(--accent-soft);color:#8CB8FF}
.chip.gold{background:#3A3018;color:var(--gold)}
.chip.red{background:#3D1B21;color:#FF8A95}
.helmet{flex:none;display:grid;place-items:center;border-radius:16px;background:var(--surface-2)}
.helmet svg{display:block;width:86%;height:auto;shape-rendering:crispEdges;image-rendering:pixelated}
.hed{display:flex;flex-direction:column;gap:12px}
.hed .opts{display:flex;flex-wrap:wrap;gap:6px}
.hed .opt{border:2px solid transparent;background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--fg)}
.hed .opt[aria-pressed="true"]{border-color:var(--accent)}
.hed .sw{width:32px;height:32px}
.ovr{font-family:var(--num);font-weight:700;font-size:44px;line-height:1;color:var(--fg)}
.ovr small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.statrow{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:12px}
.statrow b{text-align:right;font-family:var(--num);font-size:19px}
.delta{color:var(--bad)!important;font-weight:700}
.delta.down{color:var(--accent)!important}
.field{background:var(--surface-2);border:0;border-radius:14px;padding:14px 16px;color:var(--fg);font:inherit;font-size:16px;width:100%;min-width:0}
.field::placeholder{color:var(--dim)}
label.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 96px;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:22px;height:6px;border-radius:6px;background:var(--line)}
.steps i.on{background:var(--accent)}
.choice{background:var(--surface);border:2px solid transparent;border-radius:22px;padding:18px 20px;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%}
.choice[aria-pressed="true"]{border-color:var(--accent)}
.choice .row .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px}
.choice[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;background:none;border:0;text-align:left;width:100%}
.item + .item{border-top:1px solid var(--line)}
.item .dot{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:15px;color:#fff;background:var(--surface-2)}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column}
.item .body b{font-weight:700}
.item .body span{color:var(--muted);font-size:13px}
.item .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none}
.item[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs div{display:flex;max-width:480px;width:100%;justify-content:space-around}
.tabs button{background:none;border:0;color:var(--dim);font-size:13px;padding:6px 18px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px;fill:currentColor}
.tabs button[aria-current="page"]{color:var(--fg)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 4px;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td.r{text-align:right}
.tbl tr.me td{color:var(--accent);font-weight:700}
.lg{display:inline-grid;place-items:center;border-radius:7px;background:#2B2E36;vertical-align:-7px;margin-right:7px;overflow:hidden;flex:none}
.lg img{width:88%;height:88%;object-fit:contain;display:block}
.lg.fb{color:#fff;font-family:var(--num);font-size:9px;font-weight:700;letter-spacing:0}
.tdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.ev{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ev::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:8px;flex:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet .card{width:100%;max-width:480px;border-radius:24px 24px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.big{font-family:var(--num);font-weight:700;font-size:34px;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.statgrid div{display:flex;flex-direction:column;gap:2px}
.statgrid span{font-size:12px;color:var(--muted)}
.cardimg{width:100%;border-radius:18px;display:block}
.prog{min-height:calc(100vh - 60px);display:flex;flex-direction:column;gap:18px;padding-top:40px}
.prog .h2{font-size:30px;min-height:2.6em}
.progbar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.progbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width .2s linear}
.progrank{display:flex;align-items:baseline;gap:10px}
.progrank b{font-family:var(--num);font-weight:700;font-size:64px;line-height:1}
.feed{display:flex;flex-direction:column;gap:8px;margin-top:auto;max-height:38vh;overflow-y:auto}
.feed div{background:var(--surface-2);border-radius:16px;padding:14px 16px;display:flex;gap:10px;align-items:center;font-size:15px}
.feed div::before{content:"";width:22px;height:22px;border-radius:50%;flex:none;background:var(--good)}
.feed div.gold::before{background:var(--gold)}.feed div.bad::before{background:var(--bad)}.feed div.blue::before{background:var(--accent)}
@media (prefers-reduced-motion:reduce){.progbar i{transition:none}}
.gauge{display:grid;grid-template-columns:56px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.gauge .bar i.fan{background:var(--gold)}.gauge .bar i.mor{background:var(--good)}
.item .dot.g{font-family:var(--body);font-size:13px}
.notice{background:#121317;border:1px solid #2A2D35;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.notice .flag{height:26px;background:repeating-conic-gradient(#ECEDF1 0 25%,#121317 0 50%) 0 0/13px 13px;-webkit-mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.9) 40%,transparent 100%);mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.9) 40%,transparent 100%)}
.notice .nb{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px;position:relative}
.notice .nb::before{content:"";position:absolute;left:0;top:14px;bottom:18px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.notice .eyebrow{color:var(--gold);font-weight:700;letter-spacing:.02em}
.notice .h3{color:#fff}
.notice ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#D9DBE1}
.notice li{position:relative;padding-left:18px}
.notice li::before{content:"";position:absolute;left:0;top:.5em;width:9px;height:9px;background:repeating-conic-gradient(#ECEDF1 0 25%,#121317 0 50%) 0 0/4.5px 4.5px;border-radius:1px}
.offerrow{display:flex;align-items:center;gap:8px}
.offerrow + .offerrow{border-top:1px solid var(--line)}
.offerrow .item{flex:1;min-width:0;border-top:0!important}
.infobtn{background:var(--surface-2);border:0;border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);flex:none}
.up{color:var(--bad)}.down{color:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--dim)}
.stepper span{padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.stepper span.on{background:var(--accent);color:#fff;font-weight:700}
.stepper i{font-style:normal}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.tiles div{background:var(--surface-2);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;gap:2px}
.tiles b{font-family:var(--num);font-weight:700;font-size:36px;line-height:1}
.tiles span{font-size:12px;color:var(--muted)}
.tiles .gold b{color:var(--gold)}.tiles .gold{background:#2E2714}
.tg{color:var(--good)}.tb{color:#FF6B78}
.newslist{display:flex;flex-direction:column;gap:8px;font-size:15px}
.newslist div{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.notice li.tg{color:#6FE0A0}.notice li.tb{color:#FF8A95}
.segs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.segs button{flex:1;border:0;background:none;border-radius:9px;padding:8px;color:var(--muted);font-weight:500}
.segs button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.tgroup{display:flex;flex-direction:column;gap:8px}
.tgroup + .tgroup{border-top:1px solid var(--line);padding-top:14px}
.thead{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%}
.thead .body{flex:1;min-width:0;display:flex;flex-direction:column}
.thead .body span{font-size:13px;color:var(--muted)}
.nhero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 14px 12px;border-radius:14px;background:#0A0B0D;border:1px solid #23262D;position:relative;overflow:hidden}
.nhero::after{content:"";position:absolute;right:-6px;top:0;bottom:0;width:70px;background:repeating-conic-gradient(#1E2026 0 25%,#0A0B0D 0 50%) 0 0/10px 10px;opacity:.7;-webkit-mask-image:linear-gradient(270deg,#000,transparent);mask-image:linear-gradient(270deg,#000,transparent)}
.nhero.top{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(242,193,78,.25)}
.nhero .pos{display:flex;align-items:baseline;gap:2px;font-family:var(--num);color:#fff;position:relative;z-index:1}
.nhero .pp{font-size:28px;font-weight:700;color:var(--gold);margin-right:4px}
.nhero .pos b{font-size:72px;line-height:.9;font-weight:700;letter-spacing:-.01em}
.nhero.top .pos b{color:var(--gold)}
.nhero .pos small{font-size:24px;color:#8D929D;font-weight:600}
.nhero .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;position:relative;z-index:1;text-align:right}
.nhero .lbl{color:#8D929D;letter-spacing:.04em}
.nhero em{font-style:normal;color:#8D929D;margin-left:4px}
.ntiles.three{grid-template-columns:repeat(3,1fr)}
.ntiles div.lead b{color:var(--gold)}
.nres{font-size:20px;word-break:keep-all;font-weight:700;letter-spacing:-.02em;color:#fff;line-height:1.3}
.ntiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px}
.ntiles div{background:#0A0B0D;border:1px solid #23262D;border-radius:10px;padding:8px 4px 7px;text-align:center;display:flex;flex-direction:column;gap:2px}
.ntiles div.lead{border-color:var(--gold)}
.ntiles b{font-family:var(--num);font-size:26px;line-height:1.05;color:#fff}
.ntiles b small{font-size:14px;margin-left:2px}
.ntiles b small.up{color:#FF7A85}.ntiles b small.down{color:#7FB2FF}
.ntiles span{font-size:11px;color:#8D929D;letter-spacing:.04em}
.tabs button{position:relative}.tabs button.new::after{content:"";position:absolute;top:4px;right:16px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--surface-2);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){.card,.choice{transition:border-color .15s}}

.app.bare{max-width:none;padding:0;gap:0}
.tabs[hidden]{display:none}
html,body{margin:0}
.ttl{min-height:100vh;min-height:100dvh;position:relative;overflow:hidden;background:linear-gradient(180deg,#070914 0%,#10142A 45%,#1A1838 70%,#0B0D16 100%);display:flex;flex-direction:column}
.ttl .in{max-width:480px;width:100%;margin:0 auto;padding:44px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;position:relative;z-index:2}
.ttl .stars{position:absolute;inset:0;z-index:0;pointer-events:none}
.ttl .stars i{position:absolute;width:2px;height:2px;background:#fff;opacity:.7;animation:tw 3s steps(2) infinite}
@keyframes tw{50%{opacity:.15}}
.ttl .eb{font-family:var(--num,'Barlow Condensed'),sans-serif;font-weight:700;letter-spacing:.28em;font-size:13px;color:#8C93B0}
.ttl .logo{width:308px;max-width:86vw;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 6px 24px rgba(240,68,82,.25));animation:bob 2.4s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.ttl .sub{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;font-size:14px;white-space:nowrap;color:var(--gold);margin-top:2px}
.scene{position:relative;width:100%;height:178px;margin:14px 0 6px;z-index:1}
.scene .glow{position:absolute;left:50%;top:-30px;width:320px;height:120px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(255,236,190,.16),transparent 70%)}
.scene .stand{position:absolute;left:0;right:0;top:18px;height:44px;background:
 repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,214,120,.55) 6px 8px,transparent 8px 14px,rgba(120,170,255,.45) 14px 16px,transparent 16px 22px),
 repeating-linear-gradient(180deg,#1A1E36 0 10px,#141729 10px 12px);
 -webkit-mask:repeating-linear-gradient(180deg,#000 0 2px,transparent 2px 10px),linear-gradient(#000,#000);-webkit-mask-composite:source-over}
.scene .roof{position:absolute;left:0;right:0;top:10px;height:8px;background:repeating-linear-gradient(90deg,#252A48 0 30px,#1E2240 30px 32px)}
.scene .kerb{position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#E10600 0 16px,#F2F2F2 16px 32px)}
.scene .k1{top:62px}.scene .k2{top:144px}
.scene .track{position:absolute;left:0;right:0;top:70px;height:74px;background:#2A2D38}
.scene .track::after{content:"";position:absolute;left:0;right:0;top:35px;height:4px;background:repeating-linear-gradient(90deg,#E9E9EE 0 22px,transparent 22px 44px);opacity:.55}
.scene .grass{position:absolute;left:0;right:0;top:152px;height:26px;background:repeating-linear-gradient(90deg,#173B26 0 12px,#14331F 12px 24px)}
.scene .car{position:absolute;left:0;image-rendering:pixelated;will-change:transform}
.scene .kart{top:90px;width:72px;animation:drive 7s linear infinite}
.scene .f1{top:106px;width:128px;animation:drive2 7s linear infinite}
.scene .f1::before{content:"";position:absolute;right:100%;top:40%;width:90px;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5));box-shadow:0 8px 0 -0px rgba(255,255,255,.25)}
@keyframes drive{0%{transform:translateX(-90px)}45%{transform:translateX(520px)}100%{transform:translateX(520px)}}
@keyframes drive2{0%,50%{transform:translateX(-160px)}72%{transform:translateX(560px)}100%{transform:translateX(560px)}}
.scene .flagrow{position:absolute;left:0;right:0;bottom:-14px;height:12px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/12px 12px;opacity:.9}
.ttl .menu{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:22px}
.ttl .btn small{display:block;font-size:12px;font-weight:500;opacity:.8;margin-top:2px}
.ttl .disc{font-size:11px;color:#6B7290;text-align:center;margin:auto 0 0;padding-top:18px;line-height:1.5}
.ttl .ask{background:#1A1D2B;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lights{position:fixed;inset:0;z-index:99;background:rgba(4,5,9,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;cursor:pointer}
.lights .gantry{display:flex;gap:10px;padding:12px 14px;background:#0E0F14;border-top:6px solid #22252F;border-radius:6px}
.lights .pod{width:46px;padding:7px 0;background:#15161C;border:2px solid #262833;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:7px}
.lights .pod i{width:30px;height:30px;border-radius:50%;background:#2A0B0E;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4)}
.lights .pod.on i{background:#FF2A2A;box-shadow:0 0 18px 4px rgba(255,40,40,.7),inset 0 -3px 0 rgba(0,0,0,.25)}
.lights .go{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:56px;letter-spacing:.04em;color:#fff;font-style:italic;opacity:0;transform:scale(.7);transition:all .18s}
.lights.out .go{opacity:1;transform:scale(1)}
.lights .skip{position:absolute;bottom:28px;font-size:12px;color:#5B6070}
.hof .row2{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #23262F}
.hof .rk{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;width:26px;text-align:center;color:var(--dim)}
.hof .rk.g{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.scene .car,.ttl .logo,.ttl .stars i{animation:none}.scene .car{transform:translateX(40px)}.scene .f1{transform:translateX(200px)}}

.celeb{position:fixed;inset:0;z-index:98;background:radial-gradient(circle at 50% 38%,rgba(242,193,78,.28),transparent 60%),#06070C;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:cfade .3s ease-out}
.celeb.wc{background:radial-gradient(circle at 50% 36%,rgba(242,193,78,.42),rgba(225,6,0,.18) 40%,transparent 70%),#06070C}
.celeb.wc::before{content:"";position:absolute;inset:0;background:#fff;animation:flash .6s ease-out forwards;pointer-events:none}
.celeb.bye{opacity:0;transition:opacity .25s}
@keyframes cfade{from{opacity:0}}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.celeb .conf{position:absolute;inset:0;pointer-events:none}
.celeb .conf i{position:absolute;top:-12px;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}
.celeb .cin{position:relative;max-width:420px;width:100%;padding:0 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.celeb .trophy{filter:drop-shadow(0 0 22px rgba(242,193,78,.7));animation:tpop .7s cubic-bezier(.2,1.6,.4,1) both,tbob 1.6s steps(2) .7s infinite}
.celeb .trophy svg{image-rendering:pixelated;display:block}
@keyframes tpop{from{transform:scale(.2) rotate(-12deg);opacity:0}}
@keyframes tbob{50%{transform:translateY(-6px)}}
.celeb .wow{font-size:34px;font-weight:700;letter-spacing:-.03em;color:#fff;line-height:1.15;word-break:keep-all;animation:wpop .6s cubic-bezier(.2,1.8,.4,1) .25s both;text-shadow:0 3px 0 #C40500,0 0 24px rgba(242,193,78,.6)}
.celeb.wc .wow{font-size:38px;color:var(--gold)}
@keyframes wpop{from{transform:scale(.3);opacity:0}}
.celeb .wcen{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-style:italic;font-size:26px;letter-spacing:.2em;color:#fff;animation:wpop .5s ease-out .5s both}
.celeb .csub{color:#D9DCE4;font-size:15px;animation:wpop .5s ease-out .6s both}
.celeb .cnth{color:var(--gold);font-weight:700;font-size:15px;animation:wpop .5s ease-out .7s both}
.celeb .cst{display:flex;gap:8px;margin:8px 0 6px;animation:wpop .5s ease-out .8s both}
.celeb .cst span{background:rgba(255,255,255,.07);border:1px solid rgba(242,193,78,.35);border-radius:12px;padding:8px 10px;font-size:12px;color:#AEB3C2;display:flex;flex-direction:column;min-width:62px}
.celeb .cst b{font-family:'Barlow Condensed',sans-serif;font-size:24px;color:#fff;line-height:1.1}
.celeb .btn{width:100%;animation:wpop .5s ease-out 1s both}
@media (prefers-reduced-motion:reduce){.celeb *,.celeb::before{animation:none!important}}

function styleStats(base,styleId){
  const bias=B.styles.find(s=>s.id===styleId).bias;
  const st={};STATS.forEach(k=>st[k]=base+(bias[k]||0)+ri(-2,2));
  let diff=base*6-STATS.reduce((a,k)=>a+st[k],0),i=0;
  while(diff!==0){const k=STATS[i%6],s=diff>0?1:-1;st[k]+=s;diff-=s;i++}
  STATS.forEach(k=>st[k]=clamp(st[k],1,99));return st;
}

/* ---------- machines ---------- */
function updateMachines(ev){
  const MR=B.machine.major_regulation,major=(S.year-MR.first_year)%MR.cycle_years===0;
  const before={};S.teams.forEach(t=>before[t.id]=t.tier);
  if(major){
    ev.push(`${S.year} 대규정 변경! 새 규정으로 머신 판도가 흔들렸어요.`);
    S.teams.forEach(t=>{t.machine=Math.random()<MR.tier_reshuffle_chance?rnd(72,92):t.machine+rnd(-MR.swing,MR.swing)});
  }else{const m=B.machine.minor_change_per_year;S.teams.forEach(t=>t.machine+=rnd(-m,m))}
  // keep the grid shape: 4 top, 3 mid, rest bottom, values rescaled into each tier band by order
  const ts=[...S.teams].sort((a,b)=>b.machine-a.machine);let i=0;
  for(const[tier,cnt]of[['top',4],['mid',3],['bottom',ts.length-7]]){
    const[a,b]=B.machine.tiers[tier],g=ts.slice(i,i+cnt),hi=g[0].machine,lo=g.at(-1).machine;
    g.forEach(t=>{t.tier=tier;t.machine=r1(hi!==lo?a+(t.machine-lo)/(hi-lo)*(b-a):(a+b)/2)});i+=cnt;
  }
  S.teams.forEach(t=>{if(t.tier!==before[t.id]){
    const up=['bottom','mid','top'].indexOf(t.tier)>['bottom','mid','top'].indexOf(before[t.id]);
    ev.push(`${t.name}이(가) ${TIER_LBL[t.tier].replace('팀','권')}으로 ${up?'올라섰어요':'내려갔어요'}.`)}});
}

/* ---------- race simulation ---------- */
function entrant(o){return Object.assign({pts:0,wins:0,pod:0,poles:0,dnf:0,starts:0,qv:[],fp:[],absent:new Set()},o)}
function fromStats(st){return{q:skill(st,'quali'),d:skill(st,'dry'),w:skill(st,'wet'),cons:st.consistency,mental:st.mental}}
function simulate(ents,races,orders){
  const dw=B.race.driver_weight,cw=B.race.car_weight,P=B.race.points;let wet=0;
  for(let r=0;r<races;r++){
    const isWet=Math.random()<B.race.wet_race_chance;if(isWet)wet++;
    const sd=isWet?B.race.wet_noise_sd:B.race.noise_sd;
    const pr=ents.filter(e=>!e.absent.has(r));let best=null;
    for(const e of pr){e.qv[r]=dw*e.q+cw*e.car+gauss()*sd;if(!best||e.qv[r]>best.qv[r])best=e}
    if(best)best.poles++;
    const fin=[];
    for(const e of pr){e.starts++;
      const calm=clamp(((e.cons+e.mental)/2-50)/50,0,1);
      const crash=B.race.dnf.crash*(1-B.race.dnf.crash_reduction_max*calm);
      if(Math.random()<B.race.dnf.mechanical+crash){e.dnf++;e.fp[r]=99;continue}
      e.pv=dw*(isWet?e.w:e.d)+cw*e.car+gauss()*sd;fin.push(e)}
    fin.sort((a,b)=>b.pv-a.pv);
    fin.forEach((e,i)=>{e.fp[r]=i+1;if(i<P.length)e.pts+=P[i];if(i===0)e.wins++;if(i<3)e.pod++});
    if(orders)orders.push({wet:isWet,q:[...pr].sort((a,b)=>b.qv[r]-a.qv[r]).map(e=>e.key),fin:fin.map(e=>e.key),dnf:pr.filter(e=>e.fp[r]===99).map(e=>e.key)});
  }
  return wet;
}
const standingsOf=ents=>ents.filter(e=>e.starts>0).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||b.pod-a.pod);

    ents=S.f1.map(d=>{const t=teamDef(d.team);return entrant({key:d.id,name:d.name,team:t.short,color:t.color,teamId:t.id,car:t.machine,...fromStats(d.stats)})});
    me=entrant({key:'me',name:p.name,team:tm.short,color:tm.color,teamId:tm.id,car:tm.machine,isPlayer:true,...fromStats(p.stats)});
    if(p.role==='race'){
      mate=ents.find(e=>e.teamId===tm.id);
      if(Math.random()<B.career.own_injury_per_season){const k=ri(...B.career.injury_races),s=ri(0,races-k);for(let i=s;i<s+k;i++)me.absent.add(i);ev.push(`부상으로 ${k}경기를 결장했어요.`)}

          for(let i=s;i<s+k;i++){if(!me.absent.has(i))continue;me.absent.delete(i);e.absent.add(i)}

  }else{
    const isAlt=p.series==='ALT',sd=isAlt?altDef(p.alt):seriesDef(p.series);
    races=sd.races;field=Math.min(sd.field,30);seriesName=sd.name;teamName=p.team.name;
    const carT=isAlt?ALT_CAR:sd.car,mean=AI_MEAN[p.series];
    me=entrant({key:'me',name:p.name,team:p.team.name,car:carT[p.team.tier],isPlayer:true,...fromStats(p.stats)});ents.push(me);
    for(let i=1;i<field;i++){const o=mean+gauss()*5,tier=Math.random()<.3?'top':Math.random()<.57?'mid':'bottom';
      ents.push(entrant({key:'a'+i,name:genName(),team:'',car:carT[tier],q:o+gauss()*2,d:o+gauss()*2,w:o+gauss()*3,cons:o,mental:o}))}
  }
  {const mb=(p.morale-60)/15;me.q+=mb;me.d+=mb;me.w+=mb}
  const orders=[];simulate(ents,races,orders);
  // low stamina: tired mistakes turn some finishes into retirements
  if(p.morale<40){const pr=(40-p.morale)*.004;orders.forEach(o=>{const i=o.fin.indexOf('me');if(i>=0&&Math.random()<pr){o.fin.splice(i,1);o.dnf.push('me')}})}
  const cand=[];orders.forEach((o,r)=>{if(r>0&&o.fin.includes('me'))cand.push(r)});
  const n=cand.length&&Math.random()<.45?1:0;
  const pool=INC.filter(x=>!x.f1||(p.series==='F1'&&p.role==='race'));
  const incidents=[...cand].sort(()=>Math.random()-.5).slice(0,n).sort((a,b)=>a-b).map(r=>({r,id:pick(pool).id,done:false}));
  let gacha=null;
  if(p.role==='race'){const mid=Math.floor(races/2);if(orders[mid]&&!me.absent.has(mid)&&!incidents.some(x=>x.r===mid))gacha={r:mid,id:pick(GACHA).id,done:false}}
  S.season={races,orders,meAbsent:[...me.absent],mateKey:mate?mate.key:null,incidents,gacha,
    ents:ents.map(e=>({key:e.key,name:e.name,team:e.team,teamId:e.teamId||null,color:e.color||null,isPlayer:!!e.isPlayer})),

  S.phase='progress';sel=null;save();
}
function tally(upto){
  const Z=S.season,P=B.race.points,m={};
  Z.ents.forEach(e=>m[e.key]={...e,pts:0,wins:0,pod:0,poles:0,dnf:0,starts:0,fp:[],qi:[]});
  Z.orders.forEach((o,r)=>{if(r>upto)return;
    if(o.q[0])m[o.q[0]].poles++;
    o.q.forEach((k,i)=>m[k].qi[r]=i);
    o.fin.forEach((k,i)=>{const e=m[k];e.starts++;e.fp[r]=i+1;if(i<P.length)e.pts+=P[i];if(i===0)e.wins++;if(i<3)e.pod++});
    o.dnf.forEach(k=>{const e=m[k];e.starts++;e.dnf++;e.fp[r]=99})});
  return m;
}

  {let fe=p.series==='F1'?ents:null;
   if(!fe){fe=S.f1.map(d=>{const t=teamDef(d.team);return entrant({key:d.id,name:d.name,team:t.short,teamId:t.id,color:t.color,car:t.machine,...fromStats(d.stats)})});simulate(fe,seriesDef('F1').races)}
   const fs=standingsOf(fe),cons={};fe.forEach(e=>{cons[e.teamId]=(cons[e.teamId]||0)+e.pts});

     top:fs.slice(0,5).map(e=>({name:e.name,team:e.team,color:e.color,pts:e.pts,me:!!e.isPlayer})),
     cons:Object.entries(cons).sort((a,b)=>b[1]-a[1]).map(([id,pts])=>({id,name:teamDef(id).name,color:teamDef(id).color,pts}))}}
  const pos=me.starts>0?st.indexOf(me)+1:null, fieldN=st.length;
  // head to head
  let h2h=null;
  if(mate&&me.starts>0){let qW=0,qT=0,rW=0,rT=0;for(let i=0;i<races;i++){if(me.qi[i]==null||mate.qi[i]==null)continue;qT++;if(me.qi[i]<mate.qi[i])qW++;rT++;if(me.fp[i]<mate.fp[i])rW++}
    h2h={q:[qW,qT-qW],r:[rW,rT-rW],mate:mate.name}}
  // totals

  p.morale=Math.round(clamp(p.morale,0,100));p.fans=Math.round(clamp(p.fans,0,100));
  // academy evaluation

  p.history.push(rec);

  S.last={rec,ev,deltas,standings:st.slice(0,12).map((e,i)=>({pos:i+1,name:e.name,team:e.team,color:e.color||null,pts:e.pts,wins:e.wins,me:!!e.isPlayer})),meRow:pos&&pos>12?{pos,name:me.name,team:me.team,color:me.color||null,pts:me.pts,wins:me.wins,me:true}:null};

}

function grow(p,played){
  const band=B.driver.growth_by_age.find(b=>p.age>=b.from&&p.age<=b.to)||B.driver.growth_by_age.at(-1);
  const base=rnd(band.min,band.max),mult=played?1:B.driver.no_race_multiplier,ovr=ovrOf(p.stats);
  const tr=S.train?TRAIN.find(x=>x.id===S.train):null;
  const AD=B.driver.age_decline_by_stat||{};
  STATS.forEach(k=>{let g=base*rnd(.6,1.4);if(g<0)g*=AD[k]??1;
    if(g>0){g*=mult;if(p.focus.includes(k))g*=B.driver.focus_multiplier;if(tr)g*=tr.mult[k]||tr.mult.all||1;
      if(ovr>=p.potential)g=0;else if(ovr>=p.potential-B.driver.near_potential.distance)g*=B.driver.near_potential.multiplier}
    p.stats[k]=clamp(p.stats[k]+sround(g),1,99)});
}

function ageF1Grid(){
  const keep=[];S.paddock=[];
  for(const d of S.f1){
    d.age++;let delta=0;
    if(d.age<24)delta=ri(1,3);else if(d.age<=28)delta=ri(0,1);else if(d.age<=32)delta=0;else if(d.age<=35)delta=-ri(1,3);else delta=-ri(2,4);
    const o=ovrOf(d.stats);if(delta>0&&o+delta>d.potential)delta=Math.max(0,d.potential-o);
    const AD=B.driver.age_decline_by_stat||{};STATS.forEach(k=>d.stats[k]=clamp(d.stats[k]+(delta<0?Math.round(delta*(AD[k]??1)):delta)+ri(-1,1),1,99));
    const rc=B.career.retire_chance_by_age[String(Math.min(d.age,41))]||0;
    const tier=teamDef(d.team).tier;
    if(Math.random()<rc||d.age>=43){S.paddock.push(`${d.name}, ${d.age}세에 은퇴 발표`);continue}
    if(ovrOf(d.stats)<B.career.f1_seat_ovr[tier]-4){S.paddock.push(`${d.name}, ${teamDef(d.team).name} 시트를 잃어`);continue}
    if(Math.random()<(tier==='top'?.03:.09)){S.paddock.push(`${d.name}, ${teamDef(d.team).name}와(과) 계약 만료로 결별`);continue}
    keep.push(d);
  }
  S.f1=keep;
  // open seats stay open until the transfer market closes (filled in applyOffer)
  S.vacancies=[];
  for(const t of S.teams){for(let i=seatsTaken(t.id);i<2;i++){S.vacancies.push(t.id);S.paddock.push(`${t.name}, ${S.year+1} 시즌 시트 공석`)}}
}
function seatsTaken(id){return S.f1.filter(d=>d.team===id).length+((S.p.series==='F1'&&S.p.role==='race'&&S.p.team&&S.p.team.id===id)?1:0)}
function fillVacancies(){for(const t of S.teams)for(let i=seatsTaken(t.id);i<2;i++){const r=rookie(t.id);S.f1.push(r);if(r.prodigy)S.p.rivalNote=`${r.name}, ${t.name}에서 데뷔하는 천재 신인`};S.vacancies=[]}
function fillSeat(teamId){const n=S.f1.filter(d=>d.team===teamId).length;for(let i=n;i<2;i++)S.f1.push(rookie(teamId))}

/* ---------- offers ---------- */
function terms(t){const p=S.p,rk=!p.debutYear,ovr=ovrOf(p.stats);
  const years=rk?ri(1,2):t.tier==='top'?ri(1,3):ri(2,3),option=rk?Math.random()<.6:Math.random()<.3,clause=ovr>=85&&Math.random()<.5;
  const sal=Math.max(.5,(p.val||valueOf())*(t.tier==='top'?.32:t.tier==='mid'?.26:.2)*(p.series==='F1'&&p.role==='race'?1:3));
  return{years,option,clause,sal,termTxt:`${years}년 계약 · 연봉 ${won(sal)}${option?' + 1년 옵션':''}${clause?' · 성적 조항':''}`}}
const slPoints=()=>S.p.sl.filter(x=>x.year>=S.year-3).reduce((a,b)=>a+b.pts,0);
const SW={KART:.2,F4:.3,FRECA:.4,F3:.55,F2:.75,ALT:.65,F1:1};
function recentForm(){const p=S.p,H=p.history.slice(-3).reverse(),W=[.5,.3,.2];let s=0,ws=0;
  H.forEach((h,i)=>{let perf;if(!h.pos)perf=h.role==='reserve'&&h.starts?.35:.15;else perf=1-(h.pos-1)/Math.max(1,h.field-1);
    if(h.h2h){const tot=h.h2h.q[0]+h.h2h.q[1]+h.h2h.r[0]+h.h2h.r[1]||1;perf=perf*.6+(h.h2h.q[0]+h.h2h.r[0])/tot*.4}
    perf=Math.min(1,perf+h.wins*.02+(h.titled?.15:0));s+=perf*(SW[h.sid]||.5)*W[i];ws+=W[i]});
  return Math.round(clamp((ws?s/ws:.1)*100+(p.repBonus||0),0,100))}
function valueOf(){const p=S.p,ovr=ovrOf(p.stats),base=.05*Math.exp((ovr-45)/8.5);
  const sf=p.series==='F1'?(p.role==='race'?25:8):p.series==='ALT'?6:{KART:1,F4:1.2,FRECA:1.6,F3:2.2,F2:3}[p.series]||1;
  const af=p.age<=22?1.1:p.age<=29?1:p.age<=33?.85:.65;
  return Math.round(base*sf*af*(.6+.8*p.rep/100)*(1+p.fans/250)*100)/100}
function won(v){if(v>=1)return(v>=10?Math.round(v):Math.round(v*10)/10)+'억 원';const m=Math.round(v*10000);return m>=1000?Math.round(m/100)/10+'천만 원':m+'만 원'}
const fameTier=()=>S.p.rep>=85?'슈퍼스타':S.p.rep>=70?'주목받는 드라이버':S.p.rep>=50?'이름이 알려짐':S.p.rep>=30?'무명에 가까움':'무명';
const repAdj=()=>(S.p.rep-50)/50*B.career.seat_rep_adjust;
const fanAdj=t=>t&&t.tier==='bottom'?Math.min(5,S.p.fans/20):0;
function jTeam(series,tier){const l=K.junior_teams[series];return pick(l.filter(t=>t.tier===tier).length?l.filter(t=>t.tier===tier):l)}
const up=t=>t==='bottom'?'mid':'top';
function makeOffers(pos,field,h2h){
  const p=S.p,o=[],ovr=ovrOf(p.stats),r=pos?pos/field:1;
  if(p.age>=42)return[{kind:'retire',title:'은퇴',sub:'커리어를 마무리해요'}];
  const slOK=p.age>=B.super_licence.min_age&&slPoints()>=B.super_licence.points_needed;
  const inJunior=ORDER.includes(p.series);
  const juniorOffer=(series,tier,extra={})=>{const t=jTeam(series,tier);return{kind:'junior',series,team:{name:t.name,tier:t.tier},
    title:extra.title||t.name,sub:extra.sub||`${seriesDef(series).name} · ${TIER_LBL[t.tier]}`,tag:extra.tag,academy:extra.academy}};
  // junior ladder
  if(inJunior&&p.role==='race'){
    const idx=ORDER.indexOf(p.series),next=ORDER[idx+1],next2=ORDER[idx+2];
    let pt=r<=.1?'top':r<=.3?'mid':r<=.5?'bottom':null;
    if(pt&&p.rep>=80)pt=up(pt);
    const sponsor=p.fans>=40&&pt&&pt!=='top';if(sponsor)pt=up(pt);
    if(p.academy){pt=pt?up(pt):(r<=.66?'bottom':null)}
    if(next&&pt&&p.age>=seriesDef(next).age[0])o.push(juniorOffer(next,pt,{tag:sponsor?'승격 · 스폰서 지원':'승격'}));
    if(next2&&pos===1&&p.seriesSeasons===1&&p.age>=seriesDef(next2).age[0]-1)o.push(juniorOffer(next2,'top',{tag:'월반',sub:`${seriesDef(next2).name}로 한 단계 건너뛰기 · ${TIER_LBL.top}`}));
    const canStay=p.series==='F2'?p.f2Seasons<B.career.f2_max_seasons:p.age<=seriesDef(p.series).age[1];
    if(canStay)o.push(juniorOffer(p.series,r<=.2?'top':r<=.5?'mid':'bottom',{tag:'잔류'}));
    if(!p.academy&&p.series!=='F2'&&pos&&(pos<=3||p.rep>=70&&pos<=6)){
      const acs=[...K.academies].sort(()=>Math.random()-.5).slice(0,pos===1?2:1);
      for(const a of acs){const ns=next&&p.age>=seriesDef(next).age[0]?next:p.series;const t=jTeam(ns,'top');
        o.push({kind:'junior',series:ns,team:{name:t.name,tier:'top'},academy:a.id,tag:'아카데미',title:a.name+' 입단',sub:`${seriesDef(ns).name} · ${t.name} 배치`})}
    }
  }
  // F1 seats
  const inF1Race=p.series==='F1'&&p.role==='race';
  let bound=false,buyout=false;const evs=S.last?S.last.ev:[];
  if(inF1Race){
    const tm=teamDef(p.team.id),thr=B.career.f1_seat_ovr[tm.tier]-repAdj();
    const mateOvr=S.f1.filter(d=>d.team===tm.id).map(d=>ovrOf(d.stats))[0]||0;
    const h=h2h?(h2h.q[0]+h2h.r[0])/Math.max(1,h2h.q[0]+h2h.q[1]+h2h.r[0]+h2h.r[1]):.5;
    const keepOK=ovr>=thr-3||(h>=.4&&ovr>=thr-6)||ovr>=mateOvr-2;
    const c=p.contract||{left:0,option:false,clause:false};
    const base={color:tm.color,short:tm.short};
    if(h2h&&h<.25&&ovr<mateOvr-4){evs.push(`${tm.name}이(가) 팀메이트에 크게 밀린 성적을 이유로 계약을 조기 해지했어요.`);p.contract=null}
    else if(c.left>0){
      const rank=[...S.teams].sort((a,b)=>b.machine-a.machine).findIndex(x=>x.id===tm.id)+1;
      if(c.clause&&rank>6)evs.push(`성적 조항 발동! ${tm.name} 머신이 ${rank}번째로 밀려 계약을 해지하고 떠날 수 있어요.`);
      else{bound=true;buyout=(pos&&pos<=5)||h>=.65}
      o.push({kind:'stay',...base,title:`${tm.name} 계약 유지`,sub:`${c.left}년 남음 · ${TIER_LBL[tm.tier]} · 머신 ${tm.machine}`,tag:'계약 중'});
    }else if(c.option&&keepOK){
      evs.push(`${tm.name}이(가) 1년 옵션을 행사했어요.`);bound=true;
      o.push({kind:'option',...base,title:`${tm.name} 옵션 연장`,sub:`팀이 옵션을 행사해 1년 더 함께해요 · 머신 ${tm.machine}`,tag:'옵션'});
    }else if(keepOK){const tr=terms(tm);o.push({kind:'resign',...base,...tr,title:`${tm.name} 재계약`,sub:`${tr.termTxt} · 머신 ${tm.machine}`,tag:'재계약'})}
  }
  const contracted=()=>o.some(x=>['resign','stay','option'].includes(x.kind));
  if((slOK||inF1Race)&&(!bound||buyout)){
    const ac=p.academy?K.academies.find(a=>a.id===p.academy):null;
    const cands=[];
    for(const id of new Set(S.vacancies||[])){const t=teamDef(id);
      if(inF1Race&&t.id===p.team.id)continue;
      const mine=ac&&ac.teams.includes(t.id);
      const thr=B.career.f1_seat_ovr[t.tier]-repAdj()-fanAdj(t)-(mine?3:0);
      const fameBias=t.tier==='top'?(p.rep-50)/10:0;
      if(ovr>=thr)cands.push({t,score:t.machine+rnd(-4,4)+(mine?5:0)+fameBias,mine});
    }
    cands.sort((a,b)=>b.score-a.score).filter(c=>!bound||c.t.machine>teamDef(p.team.id).machine).slice(0,bound?1:3).forEach(c=>{const tr=terms(c.t);o.push({kind:'f1',teamId:c.t.id,...tr,title:`${c.t.name} 레이스 시트`,
      sub:`${tr.termTxt} · ${TIER_LBL[c.t.tier]} · 머신 ${c.t.machine}${ac&&!c.mine?' · 아카데미 계약 해지':''}`,color:c.t.color,short:c.t.short,tag:bound?'바이아웃 제안':'F1'})});
  }
  // reserve
  const reserveEligible=p.age>=18&&ovr>=66&&!inF1Race&&(p.series==='F2'||p.series==='F3'||p.series==='ALT'||(p.series==='F1'));
  const hasF1=o.some(x=>x.kind==='f1');
  if(!bound&&((reserveEligible&&!hasF1)||(inF1Race&&!contracted()))){
    const ac=p.academy?K.academies.find(a=>a.id===p.academy):null;
    let ids=ac?ac.teams.filter(id=>id!==p.team?.id):[];
    if(!ids.length&&Math.random()<.6)ids=[pick(S.teams.filter(t=>t.tier!=='bottom')).id];
    if(p.series==='F1'&&p.role==='reserve'&&!ids.includes(p.team.id)&&Math.random()<.5)ids.push(p.team.id);
    ids.slice(0,2).forEach(id=>{const t=teamDef(id);o.push({kind:'reserve',teamId:id,title:`${t.name} 리저브 드라이버`,sub:'대타 기회를 기다리며 FP1·시뮬레이터 작업',color:t.color,short:t.short,tag:'리저브'})});
  }
  // other series
  const needAlt=p.age>=21&&(p.series==='F2'||p.series==='ALT'||(p.series==='F1'&&(p.role==='reserve'||!contracted())))&&!bound;
  if(needAlt){
    const alts=p.series==='ALT'?[altDef(p.alt),...K.alt_series.filter(a=>a.id!==p.alt).sort(()=>Math.random()-.5).slice(0,1)]:[...K.alt_series].sort(()=>Math.random()-.5).slice(0,2);
    const tier=ovr>=82?'top':ovr>=76?'mid':'bottom';
    alts.forEach(a=>o.push({kind:'alt',altId:a.id,tier,title:a.name,sub:`${TIER_LBL[tier]} 시트${a.note?' · '+a.note:''}`,tag:p.series==='ALT'&&a.id===p.alt?'잔류':'다른 진로'}));
  }
  if(p.age>=30)o.push({kind:'retire',title:'은퇴',sub:'커리어를 마무리하고 커리어 카드를 받아요'});
  if(!o.length){
    if(inJunior&&p.age<21)o.push(juniorOffer(p.series,'bottom',{tag:'잔류',sub:`${seriesDef(p.series).name} · ${TIER_LBL.bottom} · 마지막 기회`}));
    else{const a=pick(K.alt_series);o.push({kind:'alt',altId:a.id,tier:'bottom',title:a.name,sub:`${TIER_LBL.bottom} 시트`,tag:'다른 진로'})}
  }
  return o;
}

function applyOffer(o){
  const p=S.p,ev=[];
  const leavingF1Seat=p.series==='F1'&&p.role==='race'&&!(o.kind==='resign');
  const oldTeam=p.series==='F1'?p.team.id:null;
  if(o.kind==='retire'){p.retired=true;if(leavingF1Seat)fillSeat(oldTeam);S.phase='retired';save();return}
  if(o.kind==='junior'){
    if(o.academy){p.academy=o.academy;p.academyBad=0}
    p.seriesSeasons=p.series===o.series?p.seriesSeasons+1:1;if(o.series==='F2')p.f2Seasons++;
    p.series=o.series;p.team=o.team;p.role='race';
  }else if(o.kind==='resign'){p.seriesSeasons++;p.contract={left:o.years,option:o.option,clause:o.clause}}
  else if(o.kind==='stay'){p.seriesSeasons++}
  else if(o.kind==='option'){p.seriesSeasons++;p.contract={left:1,option:false,clause:!!(p.contract&&p.contract.clause)}}
  else if(o.kind==='f1'){reactTransfer(o);
    p.series='F1';p.role='race';p.team={id:o.teamId};p.seriesSeasons=1;if(!p.debutYear)p.debutYear=S.year;p.academy=null;p.contract={left:o.years,option:o.option,clause:o.clause};
    if(leavingF1Seat)fillSeat(oldTeam);
  }else if(o.kind==='reserve'){p.contract=null;p.series='F1';p.role='reserve';p.team={id:o.teamId};if(leavingF1Seat)fillSeat(oldTeam)}
  else if(o.kind==='alt'){p.contract=null;p.seriesSeasons=p.series==='ALT'&&p.alt===o.altId?p.seriesSeasons+1:1;p.series='ALT';p.alt=o.altId;p.team={name:altDef(o.altId).name,tier:o.tier};p.role='race';if(leavingF1Seat)fillSeat(oldTeam)}
  fillVacancies();
  p.morale=Math.round(p.morale+(85-p.morale)*.45);
  if(S.train==='rest')p.morale=Math.min(100,p.morale+15);
  p.val=valueOf();p.valPeak=Math.max(p.valPeak||0,p.val);
  S.offers=[];S.phase='ready';S.events=genEvents();buildNotice();
  S.challenge=(p.series==='F1'&&p.role==='race'&&Math.random()<.2+p.fans/250)?(Math.random()<.7||p.age<24?{id:'LEMANS',name:'르망 24시'}:{id:'INDY500',name:'인디 500'}):null;
  save();
}

function gachaP(g){return clamp(g.p+(S.p.morale-60)/300,.25,.9)}
function resolveGacha(go){
  const Z=S.season,G=Z.gacha,g=GACHA.find(x=>x.id===G.id);G.done=true;
  G.go=go;G.res=go?null:'rest';
  if(!go){applyEff({morale:6});save();return{ok:null,t:'쉬면서 체력을 챙겼어요 · 체력 +6'}}
  applyEff({morale:-6});
  if(Math.random()<gachaP(g)){G.res='win';const m=applyEff(g.win);save();return{ok:true,t:`성공! ${m} · 체력 -6`}}
  G.res=g.slump?'slump':'inj';
  if(g.slump){const o=Z.orders[G.r],i=o.fin.indexOf('me');if(i>=0){const ni=Math.min(o.fin.length-1,i+g.slump);o.fin.splice(i,1);o.fin.splice(ni,0,'me')}
    applyEff({morale:-4});save();return{ok:false,t:`실패… 피로가 쌓여 다음 레이스 페이스가 떨어져요 · 체력 -10`}}
  const k=ri(...g.inj);let miss=0;
  for(let r=G.r;r<Math.min(Z.races,G.r+k);r++){const o=Z.orders[r];o.fin=o.fin.filter(x=>x!=='me');o.dnf=o.dnf.filter(x=>x!=='me');o.q=o.q.filter(x=>x!=='me');if(!Z.meAbsent.includes(r)){Z.meAbsent.push(r);miss++}}
  applyEff({morale:-5});Z.ctx.ev.push(`${g.title.replace(' 해볼까요?','')} 중 부상으로 ${miss}경기를 결장했어요.`);save();
  return{ok:false,t:`부상! ${miss}경기 결장 · 체력 -11`};
}
function showGacha(){
  const Z=S.season,G=Z.gacha,g=GACHA.find(x=>x.id===G.id),box=document.getElementById('pInc');if(!box)return;
  const pct=Math.round(gachaP(g)*100),f1=Z.ctx.f1;

    <div class="row"><span>실패하면</span><span class="down">${g.slump?'다음 레이스 부진':`부상 ${g.inj[0]===g.inj[1]?g.inj[0]:g.inj[0]+'~'+g.inj[1]}경기 결장`}</span></div></div>
    <button class="btn" type="button" data-gacha="go">도전한다</button><button class="btn ghost" type="button" data-gacha="rest">안전하게 쉰다</button></section></div>`;
}
function effChips(e){const a=[];const add=(l,v)=>a.push(`<span class="chip ${v>0?'up':'down'}" style="font-size:13px">${l} ${v>0?'+':''}${v}</span>`);
  if(e.stats)for(const k in e.stats)add(LBL[k],e.stats[k]);if(e.fans)add('인기',e.fans);if(e.morale)add('체력',e.morale);if(e.rep)add('팀 평가',e.rep);
  return a.length?`<span class="chips">${a.join('')}</span>`:''}
function effText(e){const a=[];if(e.stats)for(const k in e.stats)a.push(`${LBL[k]} +${e.stats[k]}`);if(e.fans)a.push(`인기 +${e.fans}`);if(e.morale)a.push(`체력 +${e.morale}`);return a.join(' · ')}

function genEvents(){
  const p=S.p,stage=p.series==='F1'?'f1':ORDER.includes(p.series)?'junior':'all';
  const x=Math.random(),n=x<.35?0:x<.85?1:2;if(!n)return[];
  const recent=new Set(S.recentEv||[]);
  const pool=EVENTS.filter(e=>(e.stage==='all'||e.stage===stage)&&!recent.has(e.id));
  const W={'팬':3,'팀':2.5,'특별훈련':2,'컨디션':1.5,'가정사':1.2},out=[];
  while(out.length<n){const c=pool.filter(e=>!out.includes(e));if(!c.length)break;
    let r=Math.random()*c.reduce((a,e)=>a+(W[e.cat]||1),0);const pickE=c.find(e=>(r-=W[e.cat]||1)<0)||c[0];
    if(out.some(o=>o.cat===pickE.cat)&&c.some(e=>!out.some(o=>o.cat===e.cat)))continue;out.push(pickE)}
  S.recentEv=[...(S.recentEv||[]),...out.map(e=>e.id)].slice(-6);
  return out.map(e=>({id:e.id}));
}

function applyEff(eff){
  const p=S.p,parts=[];
  if(eff.stats)for(const k in eff.stats){p.stats[k]=clamp(p.stats[k]+eff.stats[k],1,99);parts.push(`${LBL[k]} ${eff.stats[k]>0?'+':''}${eff.stats[k]}`)}
  if(eff.fans){p.fans=clamp(p.fans+eff.fans,0,100);parts.push(`인기 ${eff.fans>0?'+':''}${eff.fans}`)}
  if(eff.morale){p.morale=clamp(p.morale+eff.morale,0,100);parts.push(`체력 ${eff.morale>0?'+':''}${eff.morale}`)}
  if(eff.rep){p.repBonus=(p.repBonus||0)+eff.rep;p.rep=clamp(p.rep+eff.rep,0,100);parts.push(`팀 평가 ${eff.rep>0?'+':''}${eff.rep}`)}
  p.peak=Math.max(p.peak,ovrOf(p.stats));return parts.join(' · ');
}
function runChallenge(){
  const p=S.p,c=S.challenge,ovr=ovrOf(p.stats);
  const win=clamp(.05+(ovr-75)*.02,.03,.35),x=Math.random();
  const res=x<win?'우승':x<win*2.5?'포디움':x<.85?'완주':'리타이어';
  p.challenges.push({id:c.id,name:c.name,year:S.year,res});
  applyEff({fans:res==='우승'?10:4,morale:-10,rep:2});
  S.challenge=null;save();
  return`${c.name} ${res}!${res==='우승'&&tripleCrown()?' 트리플 크라운 달성!':''}`;
}
const wonC=id=>S.p.challenges.some(c=>c.id===id&&c.res==='우승');

const LOGO_IMG={};K.teams.forEach(k=>{if(k.logo){const i=new Image();i.src=k.logo;LOGO_IMG[k.id]=i}});
const kTeam=id=>K.teams.find(x=>x.id===id);
function logo(id,sz=26){const k=kTeam(id);if(!k)return'';const t=S&&S.teams?S.teams.find(x=>x.id===id)||k:k;
  return k.logo?`<span class="lg" style="width:${sz}px;height:${sz}px"><img src="${k.logo}" alt=""></span>`:`<span class="lg fb" style="width:${sz}px;height:${sz}px;background:${t.color}">${k.short}</span>`}
function bigLogo(id,sz=52){const k=kTeam(id),t=teamDef(id)||k;
  return`<span style="width:${sz}px;height:${sz}px;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;background:${k.logo?'#2B2E36':t.color};color:#fff;font-family:var(--num);font-weight:700;font-size:15px">${k.logo?`<img src="${k.logo}" alt="" style="width:86%;height:86%;object-fit:contain">`:k.short}</span>`}
function withLogos(h){if(!S||!S.teams)return h;
  for(const t of [...S.teams].sort((a,b)=>b.name.length-a.name.length))h=h.split(esc(t.name)).join('\u0000'+t.id+'\u0001');
  return h.replace(/\u0000([a-z]+)\u0001/g,(_,id)=>logo(id,24)+esc(teamDef(id).name))}
const teamByShort=s=>S.teams.find(t=>t.short===s);

const ME_BAD=['방출됐어요','아카데미 경고','조기 해지','부상으로','리타이어'];
const ME_GOOD=['챔피언!','우승!','대타 콜업','성적 조항 발동'];
const T_GOOD=['올라섰','좋다는 소문','순조','영입 검토','월드 챔피언','컨스트럭터 챔피언십 우승','데뷔 확정'];
const T_BAD=['내려갔','고전','떨어졌','시트를 잃','은퇴'];
function tone(s,o={}){
  const p=S.p,my=o.team!==undefined?o.team:(p.series==='F1'?teamDef(p.team.id).name:null);
  if(ME_BAD.some(w=>s.includes(w)))return'tb';
  if(ME_GOOD.some(w=>s.includes(w))||s.includes(p.name)&&T_GOOD.some(w=>s.includes(w)))return'tg';
  if(o.mine||(my&&s.includes(my))){if(T_BAD.some(w=>s.includes(w)))return'tb';if(T_GOOD.some(w=>s.includes(w)))return'tg'}
  // other teams: color from that team's point of view so offers can be compared
  if(o.any!==false&&S.teams.some(t=>s.includes(t.name))){if(T_BAD.filter(w=>w!=='은퇴').some(w=>s.includes(w)))return'tb';if(T_GOOD.some(w=>s.includes(w)))return'tg'}
  return'';
}

function helmet(h,num,size=56){return`<div class="helmet" style="width:${size}px;height:${size}px">${helmetSVG(h,num)}</div>`}
function drawHelmet(g,h,num,x0,y0,sc){helmetCells(h).forEach(([x,y,c])=>{g.fillStyle=c;g.fillRect(x0+x*sc,y0+y*sc,sc+.5,sc+.5)});
  g.font=`700 ${5*sc}px "Barlow Condensed",sans-serif`;g.textAlign='center';g.lineWidth=sc*.7;g.strokeStyle='#000';g.strokeText(String(num),x0+7*sc,y0+14.6*sc);g.fillStyle='#fff';g.fillText(String(num),x0+7*sc,y0+14.6*sc)}
function helmetEditor(h){h=normHelmet(h);
  return`<div class="hed"><div class="lbl">메인 색<div class="swatches">${HCOL.map(c=>`<button class="sw" type="button" data-hb="${c}" aria-label="메인 색 ${c}" aria-pressed="${c===h.base}" style="background:${c}"></button>`).join('')}</div></div>
    <div class="lbl">포인트 색<div class="swatches">${HCOL.map(c=>`<button class="sw" type="button" data-hs="${c}" aria-label="포인트 색 ${c}" aria-pressed="${c===h.sec}" style="background:${c}"></button>`).join('')}</div></div>
    <div class="lbl">패턴<div class="opts">${HPAT.map(([k,l])=>`<button class="opt" type="button" data-hp="${k}" aria-pressed="${k===h.pat}">${l}</button>`).join('')}</div></div>
    <div class="lbl">바이저<div class="opts">${HVIS.map(([k,l])=>`<button class="opt" type="button" data-hv="${k}" aria-pressed="${k===h.vis}">${l}</button>`).join('')}</div></div></div>`}
function randomHelmet(){return{base:pick(HCOL),sec:pick(HCOL),pat:pick(HPAT)[0],vis:pick(HVIS)[0]}}
function currentLine(){
  const p=S.p;
  if(p.series==='F1'){const t=teamDef(p.team.id);return{teamId:t.id,sid:'F1',series:'포뮬러 1',team:t.name,tier:t.tier,color:t.color,role:p.role}}
  if(p.series==='ALT')return{sid:p.alt,series:altDef(p.alt).name,team:p.team.name,tier:p.team.tier,role:'race'};
  return{series:seriesDef(p.series).name,team:p.team.name,tier:p.team.tier,role:'race'};
}
function profileCard(){
  const p=S.p,c=currentLine(),ac=p.academy?K.academies.find(a=>a.id===p.academy):null;
  return`<section class="card"><div class="row"><div class="row" style="gap:14px;justify-content:flex-start">${helmet(p.helmet,p.num)}
    <div style="min-width:0"><div class="h3">${esc(p.name)}</div><div class="muted" style="font-size:14px">${p.age}세 · ${esc(natName(p.nat))}</div></div></div>
    <div class="ovr num">${ovrOf(p.stats)}<small>OVR</small></div></div>
    <div class="chips"><span class="chip">${sLogo(c.sid||S.p.series)}${esc(c.series)}</span><span class="chip">${c.teamId?logo(c.teamId,24):''}${esc(c.team)}${c.role==='reserve'?' 리저브':''} · ${TIER_LBL[c.tier]}</span>${ac?`<span class="chip blue">${esc(ac.name)}</span>`:''}${p.series==='F1'&&p.role==='race'&&p.contract?`<span class="chip">계약 ${p.contract.left}시즌 남음${p.contract.option?' + 옵션':''}${p.contract.clause?' · 성적 조항':''}</span>`:''}${p.tot.titles?`<span class="chip gold">월챔 ${p.tot.titles}회</span>`:''}</div>
    <div class="gauge"><span class="muted">인기</span><div class="bar"><i class="fan" style="width:${p.fans}%"></i></div><b class="num">${p.fans}</b></div>
    <div class="gauge"><span class="muted">체력</span><div class="bar"><i class="mor" style="width:${p.morale}%"></i></div><b class="num">${p.morale}</b></div></section>`;
}
function readyCard(){
  const p=S.p,c=currentLine();let desc;
  if(p.series==='F1'&&p.role==='race'){const t=teamDef(p.team.id),mate=S.f1.find(d=>d.team===t.id);
    desc=`${K.series.find(s=>s.id==='F1').races}라운드. ${logo(t.id,24)}${t.name}(머신 ${t.machine})에서 ${mate?esc(mate.name)+'와(과) ':''}함께 달려요.`}
  else if(p.series==='F1')desc=`${withLogos(esc(c.team))} 리저브 드라이버. 주전이 빠지면 대타로 나서요.`;
  else{const sd=p.series==='ALT'?altDef(p.alt):seriesDef(p.series);desc=`${sd.races}라운드. ${esc(c.team)}(${TIER_LBL[c.tier]})에서 시즌을 치러요.`}
  const tr=S.train?TRAIN.find(x=>x.id===S.train):null;
  return`<section class="card"><div class="eyebrow">프리시즌</div><h2 class="h2">${S.year} 시즌 준비</h2><p class="muted" style="margin:0">${desc}</p>
    <div class="list">
      <button class="item" type="button" data-sheet="train"><span class="dot g" style="${tr?'':'background:var(--accent-soft);color:#8CB8FF'}">훈련</span><span class="body"><b>프리시즌 훈련 계획${tr?'':' <span style="color:var(--bad)">•</span>'}</b><span>${tr?esc(tr.name):'아직 고르지 않았어요'}</span></span><span class="muted">›</span></button>
      ${S.events.map((e,i)=>`<button class="item" type="button" data-sheet="ev${i}"><span class="dot g">${CAT_G[evDef(e.id).cat]||'!'}</span><span class="body"><b>${esc((evDef(e.id).cat?evDef(e.id).cat+' · ':'')+evDef(e.id).title)}</b><span>선택하지 않으면 그냥 지나가요</span></span><span class="muted">›</span></button>`).join('')}
      ${S.challenge?`<button class="item" type="button" data-sheet="ch"><span class="dot g">★</span><span class="body"><b>${S.challenge.name} 출전 제안</b><span>도전 이벤트</span></span><span class="muted">›</span></button>`:''}
    </div>
    <button class="btn" type="button" id="playBtn">${tr?`${S.year} 시즌 시작`:'훈련 계획부터 골라 주세요'}</button></section>`;
}
function resultBoard(){
  const R=S.last&&S.last.rec;if(!R)return'';
  const so=S.notice&&S.notice.so&&S.notice.so.year===R.year?S.notice.so:{year:R.year,sid:R.lk||R.sid,series:R.series,pos:R.pos,field:R.field,wins:R.wins,pod:R.podiums,poles:R.poles,prev:null};
  return`<section class="notice"><div class="flag"></div><div class="nb">${noticeTiles(so)}</div></section>`}
function resultCard(){
  const L=S.last,R=L.rec,p=S.p,d=R.ovrAfter-R.ovrBefore;
  const head=R.titled&&R.sid==='F1'?`<h2 class="h2"><span style="color:var(--gold)">월드 챔피언</span>이 됐어요</h2>`:
    `<h2 class="h2">종합 능력치가<br><span class="num" style="color:var(--accent);font-size:34px">${R.ovrAfter}</span>${d===0?'로 유지됐어요':'이 됐어요'}</h2>`;
  const posTxt=R.pos?`${R.pos}위 <span class="muted">/ ${R.field}</span>`:'출전 없음';
  return`<section class="card"><div class="eyebrow">시즌 결과 · ${R.year} ${sLogo(R.lk||R.sid)}${esc(R.series)}</div>${head}
    <div class="kv">
      <div class="row"><span>최종 순위</span><span>${posTxt}</span></div>
      <div class="row"><span>출전 · 포인트</span><span class="num">${R.starts}경기${R.dnf?` · DNF ${R.dnf}`:''} · ${R.points}점</span></div>
      ${R.train?`<div class="row"><span>프리시즌 훈련</span><span>${esc(R.train)}</span></div>`:''}
      ${R.h2h?`<div class="row"><span>vs ${esc(R.h2h.mate)}</span><span class="num">예선 ${R.h2h.q[0]}:${R.h2h.q[1]} · 레이스 ${R.h2h.r[0]}:${R.h2h.r[1]}</span></div>`:''}
      ${R.val!=null?`<div class="row"><span>몸값</span><span class="num">${won(R.valBefore)} → ${won(R.val)} ${R.val!==R.valBefore?`<span class="delta ${R.val<R.valBefore?'down':''}">${R.val>R.valBefore?'+':'-'}${won(Math.abs(R.val-R.valBefore))}</span>`:''}</span></div>`:''}
      <div class="row"><span>종합 능력치</span><span class="num">${R.ovrBefore} → ${R.ovrAfter} ${d?`<span class="delta ${d<0?'down':''}">${d>0?'+':''}${d}</span>`:''}</span></div>
      ${L.deltas.map(x=>`<div class="row"><span>${LBL[x.k]}</span><span class="num">${x.v} <span class="delta ${x.d<0?'down':''}">${x.d>0?'+':''}${x.d}</span></span></div>`).join('')}
    </div>
    ${L.ev.length?`<div class="newslist">${L.ev.map(e=>`<div class="${tone(e)}">${withLogos(esc(e))}</div>`).join('')}</div>`:''}
    ${S.react&&S.react.year===R.year?`<div class="newslist"><div style="border-left:3px solid var(--accent)"><span class="muted" style="font-size:12px">패독 분석가 J</span><br>${withLogos(esc(S.react.expert.slice(0,2).join(' ')))}</div></div>`:''}
    <button class="btn" type="button" data-go="react">반응 보기</button></section>`;
}
function offersCard(){
  const o=S.offers;
  return`<section class="card"><div class="eyebrow">다음 진로 · ${S.year} 시즌</div><h2 class="h2">도착한 제안 ${o.length}개</h2>
    <p class="muted" style="margin:0">지난 시즌 성적을 지켜본 팀들에서 연락이 왔어요.</p>
    ${S.news&&S.news.heads?`<button class="btn ghost" type="button" data-sheet="news">패독 소식·머신 판도 보고 고르기</button>`:''}
    <div class="list">${o.map((x,i)=>`<div class="offerrow"><button class="item" type="button" data-offer="${i}" aria-pressed="${sel===i}">
      ${offerTeam(x)?bigLogo(offerTeam(x)):`<span class="dot">${x.kind==='retire'?'END':x.kind==='alt'?'ALT':SLOGO[x.series]?`<img src="${SLOGO[x.series]}" alt="${x.series}" style="width:80%;height:auto">`:x.series||''}</span>`}
      <span class="body"><b>${esc(x.title)}</b><span>${esc(x.sub)}</span>${x.tag?`<span style="color:var(--accent)">${esc(x.tag)}</span>`:''}</span><span class="tick"></span></button>
      ${offerTeam(x)?`<button class="infobtn" type="button" data-brief="${i}">팀 정보</button>`:''}</div>`).join('')}</div>
    <button class="btn" type="button" id="chooseBtn" ${sel==null?'disabled':''}>이 진로로 갈게요</button></section>`;
}
function statusLine(NT){return NT.lines.find(l=>l.startsWith('슈퍼 라이선스')||l.startsWith('계약 ')||l.startsWith('리저브'))||''}
function noticeTiles(o){const mv=o.prev&&o.pos?o.prev-o.pos:0,top=o.pos&&o.pos<=3;
  return`<div class="nres">${sLogo(o.sid,20)}${o.year} ${esc(o.series)} 결과</div>
  <div class="nhero${top?' top':''}"><div class="pos"><span class="pp">P</span><b>${o.pos??'–'}</b>${o.pos?`<small>/${o.field}</small>`:''}</div>
    <div class="side"><span class="lbl">최종 순위</span>${mv?`<span class="${mv>0?'up':'down'}">${mv>0?'▲':'▼'} ${Math.abs(mv)} <em>작년 ${o.prev}위</em></span>`:o.prev?`<span class="muted">작년과 같은 순위</span>`:''}</div></div>
  <div class="ntiles three"><div class="${o.wins?'lead':''}"><b>${o.wins}</b><span>우승</span></div><div><b>${o.pod}</b><span>포디움</span></div><div><b>${o.poles??0}</b><span>폴 포지션</span></div></div>`}
function reactTab(){
  const X=S.react;if(X)X.seen=true;
  const N=S.news&&S.news.heads?S.news:null;
  return`<header class="top"><h1>반응</h1></header>
  ${X?`<section class="card"><div class="eyebrow">${X.year} ${sLogo(X.sid)}${esc(X.series)} · 패독 분석가 J</div><h3 class="h3">전문가 분석</h3>
    <div class="newslist">${X.expert.map((l,i)=>`<div${i===X.expert.length-1?' style="border-left:3px solid var(--accent)"':''}>${withLogos(esc(l))}</div>`).join('')}</div></section>
  <section class="card"><h3 class="h3">팬 반응</h3><div class="list">${X.fans.map(f=>`<div class="item" style="cursor:default;align-items:flex-start"><span class="dot g" style="border-radius:50%;width:40px;height:40px">${esc(f.nick[0])}</span>
    <span class="body"><b>${esc(f.nick)}</b><span style="color:var(--fg);font-size:15px;margin:2px 0">${withLogos(esc(f.txt))}</span><span>${f.plat} · ${f.ago} · ♥ ${f.likes}</span></span></div>`).join('')}</div>
    <p class="muted" style="margin:0;font-size:12px">게임 속 가상 반응이에요. 인기가 높을수록 반응이 많아져요.</p></section>`:`<section class="card"><p class="muted" style="margin:0">첫 시즌을 마치면 전문가와 팬들의 반응이 여기에 떠요.</p></section>`}
  ${(()=>{const NT=S.notice&&S.notice.year===S.year?S.notice:null,L=NT?NT.lines.filter(l=>l!==statusLine(NT)):[];
    return L.length?`<section class="card"><h3 class="h3">우리 팀 소식${NT.team?' · '+withLogos(esc(NT.team)):''}</h3><div class="newslist">${L.map(l=>`<div class="${l.startsWith('F1 소식')?'':tone(l,{mine:true})}">${withLogos(esc(l))}</div>`).join('')}</div></section>`:''})()}
  ${N?`<section class="card" style="gap:12px"><div class="eyebrow">${N.year} 시즌을 앞두고</div><h3 class="h3">패독 소식</h3>
    <div class="segs"><button type="button" data-ntab="all" aria-pressed="${newsTab==='all'}">전체</button><button type="button" data-ntab="team" aria-pressed="${newsTab==='team'}">팀별</button></div>
    ${newsBody(N)}
    <button class="btn ghost" type="button" data-sheet="news">컨스트럭터 순위·머신 판도</button></section>`:''}
  ${S.phase==='result'?`<button class="btn" type="button" id="okBtn">이적 시장으로</button>`:''}`;
}
function homeTab(){
  const p=S.p,last=p.history.at(-1),d=last?last.ovrAfter-last.ovrBefore:0,items=[];
  if(S.phase==='result')items.push({go:'season',g:'결과',t:'시즌 결과가 나왔어요',s:`${S.last.rec.year} ${S.last.rec.series}`,dot:1});
  if(S.phase==='offers')items.push({go:'season',g:'진로',t:'다음 진로를 골라야 해요',s:`도착한 제안 ${S.offers.length}개`,dot:1});
  if(S.phase==='ready'){
    if(!S.train)items.push({sheet:'train',g:'훈련',t:'프리시즌 훈련 계획을 골라 주세요',s:'이번 시즌 어떤 능력을 키울지 정해요',dot:1});
    S.events.forEach((e,i)=>{const d=evDef(e.id);items.push({sheet:'ev'+i,g:CAT_G[d.cat]||'!',t:`${d.cat||'선택'} · ${d.title}`,s:'선택하지 않으면 그냥 지나가요',dot:1})});
    if(S.challenge)items.push({sheet:'ch',g:'★',t:'도전 제안이 왔어요',s:`${S.challenge.name} 출전`,dot:1});
  }
  if(S.news&&S.news.heads&&S.news.year===S.year)items.push({go:'react',g:'소식',t:S.news.major?`${S.year} 대규정 변경 · 패독 소식`:`${S.year} 패독 소식`,s:S.news.heads[0].t,dot:S.phase!=='ready'||S.news.major?1:0});
  items.push({sheet:'focus',g:'↗',t:'집중 육성 중',s:p.focus.map(k=>LBL[k]).join(', ')||'없음'});
  const NT=S.notice&&S.notice.year===S.year?S.notice:null;
  return`<header class="top"><h1>카트부터 월챔까지</h1><button class="iconbtn" type="button" id="menuBtn">설정</button></header>
  ${NT&&(NT.sum||NT.lines.length)?`<section class="notice"><div class="flag"></div><div class="nb">${NT.so?noticeTiles(NT.so):NT.sum?`<div class="h3">${esc(NT.sum)}</div>`:''}${statusLine(NT)?`<ul><li>${withLogos(esc(statusLine(NT)))}</li></ul>`:''}</div></section>`:''}
  <section class="card"><div class="row" style="justify-content:flex-start;gap:14px">${helmet(p.helmet,p.num,64)}
    <div style="min-width:0"><div class="muted" style="font-size:14px">${esc(p.name)} · ${withLogos(esc(currentLine().team))} · ${p.age}세</div>
    <div class="h3" style="font-size:22px">종합 능력치 <span class="num" style="font-size:28px">${ovrOf(p.stats)}</span></div>
    ${last&&d?`<div class="delta ${d<0?'down':''}" style="font-size:14px">지난 시즌보다 ${d>0?'+':''}${d}</div>`:''}</div></div>
    <div class="row" style="background:var(--surface-2);border-radius:14px;padding:12px 14px"><span class="muted">몸값</span><span><b class="num" style="font-size:24px">${won(p.val||valueOf())}</b>${last&&last.valBefore!=null&&last.val!==last.valBefore?` <span class="${last.val>last.valBefore?'up':'down'}" style="font-size:13px">${last.val>last.valBefore?'+':'-'}${won(Math.abs(last.val-last.valBefore))}</span>`:''}</span></div>
    <div class="gauge"><span class="muted">인기</span><div class="bar"><i class="fan" style="width:${p.fans}%"></i></div><b class="num">${p.fans}</b></div>
    <div class="gauge"><span class="muted">체력</span><div class="bar"><i class="mor" style="width:${p.morale}%"></i></div><b class="num">${p.morale}</b></div></section>
  <section class="card"><div class="row"><h3 class="h3">확인할 일</h3></div>${stepper()}<div class="list">${items.map(x=>`<button class="item" type="button" ${x.go?`data-go="${x.go}"`:`data-sheet="${x.sheet}"`}>
    <span class="dot g" style="${x.dot?'background:var(--accent-soft);color:#8CB8FF':''}">${x.g}</span><span class="body"><b>${esc(x.t)}${x.dot?' <span style="color:var(--bad)">•</span>':''}</b><span>${esc(x.s)}</span></span><span class="muted">›</span></button>`).join('')}</div>
    ${S.phase==='ready'?`<button class="btn" type="button" id="playBtn">${S.train?`${S.year} 시즌 시작`:'훈련 계획부터 골라 주세요'}</button>`:''}</section>`;
}
function offerTeam(x){if(x.teamId)return x.teamId;if(['resign','stay','option'].includes(x.kind)&&S.p.series==='F1')return S.p.team.id;return null}
function seasonTab(){
  return`<header class="top"><h1>시즌</h1><button class="iconbtn" type="button" id="menuBtn">설정</button></header>${stepper()}${S.phase==='result'?resultBoard():''}${profileCard()}${
    S.phase==='result'?resultCard():S.phase==='offers'?offersCard():readyCard()}`;
}

    ${p.academyBad?`<div class="row"><span>아카데미 경고</span><span style="color:var(--bad)">${p.academyBad}회</span></div>`:''}
  </section>`;

  const big=[[p.tot.titles,'월드 챔피언','#F2C14E'],[p.tot.wins,'우승','#fff'],[p.tot.podiums,'포디움','#fff']];

const F1CAL=['호주','중국','일본','바레인','사우디아라비아','마이애미','캐나다','모나코','바르셀로나','오스트리아','영국','벨기에','헝가리','네덜란드','이탈리아','마드리드','아제르바이잔','싱가포르','미국','멕시코','브라질','라스베이거스','카타르','아부다비'];
let progTimer=null,progI=0,feed=[];
function roundName(r){return S.season.ctx.f1?`R${r+1} · ${F1CAL[r%F1CAL.length]} GP`:`${r+1}라운드`}
function progressView(){
  const C=S.season.ctx;
  return`<section class="prog">${stepper()}<div class="eyebrow">${C.year} ${sLogo(C.sid)}시즌 · ${withLogos(esc(C.teamName))}${C.role==='reserve'?' 리저브':''}</div>
    <h2 class="h2" id="pHead">${C.role==='reserve'?'패독에서 기회를 기다리고 있어요':'시즌 개막을 앞두고 있어요'}</h2>
    <div class="progbar"><i id="pBar"></i></div><div class="muted num" id="pRound" style="font-size:15px">0 / ${S.season.races} 라운드</div>
    <div class="progrank"><b id="pRank">–</b><span class="muted" id="pPts">${esc(C.seriesName)}</span></div>
    <div class="feed" id="pFeed"></div>
    <button class="btn ghost" type="button" id="skipProg">건너뛰기</button><div id="pInc"></div></section>`;
}
function roundInfo(r){
  const Z=S.season,m=tally(r),me=m.me,o=Z.orders[r],ab=Z.meAbsent.includes(r);
  const rank=me.starts>0?standingsOf(Object.values(m)).findIndex(e=>e.key==='me')+1:null;
  return{r,wet:o.wet,absent:ab,fp:ab?null:me.fp[r]??null,pole:o.q[0]==='me',pts:me.pts,rank,wins:me.wins};
}
function describe(t){
  const C=S.season.ctx;
  if(t.absent||t.fp==null)return{head:C.role==='reserve'?'패독에서 기회를 기다리고 있어요':'부상에서 회복하고 있어요'};
  if(t.fp===1)return{head:t.wins===1?'첫 우승을 차지했어요!':'우승했어요!',note:{t:`${roundName(t.r)} 우승${t.wet?' (빗속 레이스)':''}`,c:'gold'},hl:1};
  if(t.fp===99)return{head:'리타이어했어요',note:{t:`${roundName(t.r)} 리타이어`,c:'bad'},hl:1};
  if(t.fp<=3)return{head:'포디움에 올랐어요',note:{t:`${roundName(t.r)} ${t.fp}위 포디움`,c:'blue'},hl:1};
  if(t.pole)return{head:'폴 포지션을 잡았어요',note:{t:`${roundName(t.r)} 폴 포지션`,c:'blue'}};
  if(t.wet)return{head:'빗속에서 달리고 있어요'};
  if(t.rank<=3)return{head:'선두권을 지키고 있어요'};
  if(t.rank<=10)return{head:'포인트권에서 싸우고 있어요'};
  return{head:'한 계단씩 올라가고 있어요'};
}
function startProgress(){
  clearTimeout(progTimer);progI=0;feed=[];
  S.season.ctx.ev.filter(x=>x.includes('콜업')||x.includes('부상')).forEach(e=>feed.unshift({t:e,c:'blue'}));paintFeed();
  progTimer=setTimeout(stepProgress,500);
}
function paintFeed(){const f=document.getElementById('pFeed');if(f)f.innerHTML=feed.map(x=>`<div class="${x.c}">${esc(x.t)}</div>`).join('')}
function stepProgress(){
  if(!S||S.phase!=='progress'||!S.season)return;const Z=S.season;
  if(progI>=Z.races){progTimer=setTimeout(finishProgress,700);return}
  if(Z.gacha&&!Z.gacha.done&&Z.gacha.r===progI){showGacha();return}
  const inc=Z.incidents.find(x=>x.r===progI&&!x.done);
  if(inc){showIncident(inc);return}
  const t=roundInfo(progI),d=describe(t);
  if(d.note){feed.unshift(d.note);paintFeed()}
  const g=id=>document.getElementById(id);if(!g('pHead'))return;
  g('pHead').textContent=d.head;
  g('pBar').style.width=((progI+1)/Z.races*100)+'%';
  g('pRound').textContent=`${progI+1} / ${Z.races} 라운드 · ${roundName(t.r)}`;
  if(t.rank){g('pRank').textContent=t.rank+'위';g('pPts').textContent=`/ ${Z.ents.length}명 · ${t.pts}점`}
  progI++;
  progTimer=setTimeout(stepProgress,clamp(4500/Z.races,180,550)+(d.hl?450:0));
}
function showIncident(inc){
  const d=INC.find(x=>x.id===inc.id),box=document.getElementById('pInc');if(!box)return;
  document.getElementById('pBar').style.width=((inc.r+1)/S.season.races*100)+'%';
  document.getElementById('pRound').textContent=`${inc.r+1} / ${S.season.races} 라운드 · ${roundName(inc.r)}`;
  box.innerHTML=`<div class="sheet"><section class="card"><div class="eyebrow">${roundName(inc.r)} · 레이스 중 상황</div><h3 class="h2">${esc(d.title)}</h3><p class="muted" style="margin:0">${esc(d.desc)}</p>
    ${d.choices.map((c,j)=>`<button class="choice" type="button" data-inc="${j}" style="background:var(--surface-2)"><span class="h3">${esc(c.label)}</span><span class="muted" style="font-size:14px">${esc(c.desc)}</span><span class="chips">${c.fixed?`<span class="chip ${c.fixed.delta>0?'down':''}" style="font-size:13px">순위 ${c.fixed.delta>0?'-'+c.fixed.delta:'유지'}</span>`+effChips(c.fixed.eff).replace(/^<span class="chips">|<\/span>$/g,''):`<span class="chip" style="font-size:13px">관련 능력: ${c.stat?LBL[c.stat]+' '+S.p.stats[c.stat]:'운'}</span><span class="chip up" style="font-size:13px">성공 시 최대 ${-c.good[0]>0?-c.good[0]+'계단 상승':'순위 유지'}</span><span class="chip down" style="font-size:13px">실패 시 최대 ${c.bad[1]}계단 하락${c.dnf?' · 리타이어 위험':''}</span>`}</span></button>`).join('')}</section></div>`;
}
function finishProgress(){
  clearTimeout(progTimer);if(!S||S.phase!=='progress')return;
  const G=S.season.gacha,pend=S.season.incidents.find(x=>!x.done),pr=[G&&!G.done?G.r:null,pend?pend.r:null].filter(x=>x!=null);
  if(pr.length){progI=Math.min(...pr);stepProgress();return}
  finishSeason();tab='season';render();window.scrollTo(0,0);
  const R=S.last&&S.last.rec;if(R&&R.titled)celebrate(R);
}
function stepper(){
  const ph=S.phase,steps=[['ready','프리시즌'],['progress','시즌'],['result','시즌 결과'],['offers','이적 시장']];
  return`<div class="stepper">${steps.map(([k,l])=>`<span class="${k===ph?'on':''}">${l}</span>`).join('<i>›</i>')}</div>`;
}

function px(map,pal,w){const rows=map.trim().split('\n').map(r=>r.trim()),H=rows.length,W=rows[0].length;let s='';

  return`<svg viewBox="0 0 ${W} ${H}" width="${w}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${s}</svg>`}

let lightsT=[];
function lightsGo(cb){
  const el=document.createElement('div');el.className='lights';
  el.innerHTML=`<div class="gantry">${'<div class="pod"><i></i><i></i></div>'.repeat(5)}</div><div class="go">LIGHTS OUT!</div><div class="skip">탭해서 건너뛰기</div>`;
  document.body.appendChild(el);let done=false;
  const fin=()=>{if(done)return;done=true;lightsT.forEach(clearTimeout);lightsT=[];el.remove();cb()};
  el.addEventListener('click',fin);
  const pods=el.querySelectorAll('.pod');
  for(let i=0;i<5;i++)lightsT.push(setTimeout(()=>pods[i]&&pods[i].classList.add('on'),350+i*520));
  const off=350+4*520+600+Math.random()*700;
  lightsT.push(setTimeout(()=>{pods.forEach(p=>p.classList.remove('on'));el.classList.add('out')},off));
  lightsT.push(setTimeout(fin,off+750));
}

function newsBody(N){const LIM=4;
  if(newsTab==='team'){const g=teamGroups(N);if(!g.length)return'<p class="muted" style="margin:0">올해는 팀 소식이 없어요.</p>';
    const sh=newsMore?g:g.slice(0,LIM);return newsByTeam(N,sh)+(g.length>LIM?moreBtn(g.length-LIM):'')}
  const h=newsMore?N.heads:N.heads.slice(0,LIM);
  return`<div class="newslist">${h.map(h=>`<div class="${tone(h.t)}">${withLogos(esc(h.t))}</div>`).join('')}</div>`+(N.heads.length>LIM?moreBtn(N.heads.length-LIM):'')}

function teamGroups(N){
  const all=[...N.lines,...N.heads.map(h=>h.t)],offered=new Set(S.offers.map(o=>o.teamId).filter(Boolean));
  return S.teams.map(t=>({t,items:all.filter(x=>x.includes(t.name))})).filter(g=>g.items.length)
    .sort((a,b)=>(offered.has(b.t.id)-offered.has(a.t.id))||b.t.machine-a.t.machine);}
function newsByTeam(N,groups){
  const offered=new Set(S.offers.map(o=>o.teamId).filter(Boolean));groups=groups||teamGroups(N);

  return groups.map(({t,items})=>{const d=N.delta?N.delta[t.id]:0;
    return`<div class="tgroup"><button class="thead" type="button" data-tbrief="${t.id}">${bigLogo(t.id,40)}<span class="body"><b>${esc(t.name)}${offered.has(t.id)?' <span class="chip blue" style="font-size:12px">제안 도착</span>':''}</b><span>${TIER_LBL[t.tier]} · 예상 머신 ${t.machine}${d?` <span class="${d>0?'up':'down'}">${d>0?'+':''}${d}</span>`:''}</span></span><span class="muted">›</span></button>

}
